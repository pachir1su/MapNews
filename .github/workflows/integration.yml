name: MapNews integration
on:
  push:
    branches: [main, fix/release-v0.1.0-integration]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --disable-dev-shm-usage
      PYTHONPATH: .
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-*.txt
      - name: Install Qt dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxtst6 libxkbfile1 libxcb-cursor0 libxkbcommon-x11-0 fonts-noto-cjk
      - name: Install dependencies
        run: python -m pip install -r requirements-integration.txt
      - name: Syntax and lint
        run: |
          python -m compileall -q search.py run_pipeline.py data_ai map_visualization frontend
          python -m ruff check --select E4,E7,E9,F821 search.py run_pipeline.py data_ai/rule_analysis.py tests/integration
      - name: Offline pipeline regressions
        run: python -m pytest tests/integration -q --timeout=60
      - name: Existing frontend Qt regressions
        run: python -m pytest tests/frontend -m "not webengine" -q --timeout=60
      - name: QtWebEngine regressions
        run: python -m pytest tests/frontend -m "webengine" -q --timeout=90
      - name: Offline full-stage smoke using stored real data
        run: python run_pipeline.py --skip-fetch --archive news_results.json --analysis-output test-artifacts/integration-analysis.json --map-output test-artifacts/integration-map.json
      - name: Render real team JSON in native PySide6
        if: runner.os == 'Linux'
        run: python -m frontend.tools.capture_real --input map_visualization/map_results.json --output test-artifacts/real-screenshots
      - name: Probe live RSS provider (advisory only)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: python search.py --output test-artifacts/rss-live.json
      - name: Capture latest 339-story integrated Qt map
        if: runner.os == 'Linux'
        run: python -m frontend.tools.capture_real --input test-artifacts/integration-map.json --output test-artifacts/latest-real-screenshots
      - name: Audit every stored location without network
        run: python tools/audit_location_coverage.py --input news_results.json --cache map_visualization/.geocode_cache.json --output test-artifacts/location-audit
      - name: Review every flagged article and curated locations
        run: python tools/triage_location_candidates.py --archive news_results.json --cache map_visualization/.geocode_cache.json --output test-artifacts/location-review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-${{ runner.os }}
          path: test-artifacts/
          if-no-files-found: ignore
