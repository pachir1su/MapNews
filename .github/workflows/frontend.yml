name: Frontend quality
on:
  push:
    branches: ['frontend/**']
  pull_request:
    branches: [main]
    paths: ['frontend/**', 'tests/frontend/**', '*frontend*.txt', 'pyproject.toml', '.github/workflows/frontend.yml']
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --disable-dev-shm-usage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: '*frontend*.txt'
      - name: Linux Qt dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxtst6 libxkbfile1 libxcb-cursor0 libxkbcommon-x11-0 fonts-noto-cjk
      - run: python -m pip install -r requirements-frontend-dev.txt
      - run: python -m ruff check frontend tests/frontend
      - run: python -m compileall -q frontend
      - name: Test data, Qt GUI and real WebEngine bridge
        run: python -m pytest -q --junitxml=test-artifacts/junit.xml
      - name: HiDPI GUI tests
        env:
          QT_SCALE_FACTOR: '1.5'
          MAPNEWS_ARTIFACT_DIR: test-artifacts/hidpi
        run: python -m pytest tests/frontend/test_gui.py tests/frontend/test_resilience.py -m 'not webengine' -q --junitxml=test-artifacts/hidpi.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-review-${{ runner.os }}
          path: test-artifacts/
